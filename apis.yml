aid: lemonaide
name: Lemonaide
description: Lemonaide is a Bangkok-headquartered B2B used-car and insurtech platform operating across
  Southeast Asia, positioning itself as a technology and services layer that reduces asymmetric information
  in the automotive market. The company sells software to used-car dealerships and insurers, including
  a Dealer Management System, a Dealer CRM with microtargeting, and a Digital Escrow settlement product,
  alongside operated services such as after-sales BPO, warranty third-party administration, 24-hour
  digital roadside assistance, vehicle inspection, and repair-workshop audit assessment. Lemonaide states
  that more than 2,000 dealers use its platform and names Carro, Carsome, and Toyota Sure among its
  partners. It is backed by 500 Global. As of this enrichment pass Lemonaide publishes no public developer
  portal, API documentation, or machine-readable API surface.
